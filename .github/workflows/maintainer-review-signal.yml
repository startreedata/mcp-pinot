name: Repo Maintainer Review Signal

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

# Wake the default-branch controller without checkout, credentials, or artifacts.
permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: ':'
