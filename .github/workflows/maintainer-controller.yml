name: Repo Maintainer Controller

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, closed, labeled, unlabeled, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: ["Build and Test", "Lint", "Test Pinot Quickstart", "Repo Maintainer Review Signal", "Repo Maintainer Worker", "Repo Maintainer Reviewer"]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:


concurrency:
  group: repo-maintainer-controller-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  observe:
    if: ${{ vars.MAINTAINER_MODE == '' || vars.MAINTAINER_MODE == 'observe' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check immutable runtime pin
        env:
          RUNTIME_REF: ${{ '1905c699b3575e66a2e91b57394a006e974b1b6d' }}
        run: |
          [[ "$RUNTIME_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'runtime-ref must be a full lowercase commit SHA' >&2; exit 1; }
      - name: Checkout centralized runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: startreedata/startree-code-review-bot
          ref: ${{ '1905c699b3575e66a2e91b57394a006e974b1b6d' }}
          path: runtime
          token: ${{ secrets.MAINTAINER_RUNTIME_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Observe without writes or model calls
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTAINER_MODE: observe
          MAINTAINER_REVIEWER_MODE: ${{ vars.MAINTAINER_REVIEWER_MODE }}
        run: PYTHONPATH=runtime/src python -m startree_review_bot.maintainer controller --policy control/.github/maintainer/policy.toml --dry-run

  reconcile:
    if: ${{ contains(fromJSON('["maintain","autopilot"]'), vars.MAINTAINER_MODE) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check immutable runtime pin
        env:
          RUNTIME_REF: ${{ '1905c699b3575e66a2e91b57394a006e974b1b6d' }}
        run: |
          [[ "$RUNTIME_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'runtime-ref must be a full lowercase commit SHA' >&2; exit 1; }
      - name: Checkout centralized runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: startreedata/startree-code-review-bot
          ref: ${{ '1905c699b3575e66a2e91b57394a006e974b1b6d' }}
          path: runtime
          token: ${{ secrets.MAINTAINER_RUNTIME_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Create repository-scoped App token
        id: app
        if: ${{ vars.MAINTAINER_WRITER_AUTH != 'user' }}
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.MAINTAINER_APP_ID }}
          private-key: ${{ secrets.MAINTAINER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-checks: write
          permission-actions: write
      - name: Reconcile authorized work
        env:
          GH_TOKEN: ${{ vars.MAINTAINER_WRITER_AUTH == 'user' && secrets.MAINTAINER_WRITER_TOKEN || steps.app.outputs.token }}
          MAINTAINER_WRITER_ACTOR: ${{ steps.app.outputs.app-slug != '' && format('{0}[bot]', steps.app.outputs.app-slug) || '' }}
          MAINTAINER_POLICY_TOKEN: ${{ vars.MAINTAINER_WRITER_AUTH == 'user' && github.token || '' }}
          MAINTAINER_MODE: ${{ vars.MAINTAINER_MODE }}
          MAINTAINER_REVIEWER_MODE: ${{ vars.MAINTAINER_REVIEWER_MODE }}
          SLACK_BOT_TOKEN: ${{ secrets.MAINTAINER_SLACK_BOT_TOKEN }}
        run: PYTHONPATH=runtime/src python -m startree_review_bot.maintainer controller --policy control/.github/maintainer/policy.toml
