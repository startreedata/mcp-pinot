name: Test Pinot Quickstart

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  FASTMCP_MCP_CAMELCASE_COMPAT: "false"

jobs:
  test-pinot-quickstart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        version: "0.8.22"
        python-version: ${{ matrix.python-version }}
    
    - name: Verify lockfile
      run: uv lock --check

    - name: Install dependencies
      run: uv sync --frozen --all-extras
    
    - name: Set up Docker
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    
    - name: Start Pinot containers
      run: |
        docker run -d \
          --name pinot-quickstart \
          -p 9000:9000 \
          -p 8000:8000 \
          apachepinot/pinot:1.5.1@sha256:dbb65d3732eea6edf2619b0b734f13466bf1c6fd73ab9abdfa98e08a807499b2 \
          QuickStart -type batch
        .github/scripts/setup_python_test_env.sh
    
    - name: Create test environment file
      run: |
        cat > .env << EOL
        PINOT_CONTROLLER_URL=http://localhost:9000
        PINOT_BROKER_HOST=localhost
        PINOT_BROKER_PORT=8000
        PINOT_BROKER_SCHEME=http
        PINOT_USE_MSQE=true
        MCP_TRANSPORT=http
        MCP_PORT=8080
        EOL
    
    - name: Run quickstart test
      run: |
        cat .env
        source .venv/bin/activate
        # Start server in background
        uv --directory . run mcp_pinot/server.py > server.log 2>&1 &
        SERVER_PID=$!

        # Wait for server to start (avoid race with uv syncing in background)
        # Note: /mcp may return 406 depending on Accept headers; any HTTP response means it's up.
        for i in $(seq 1 60); do
          STATUS_CODE="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/mcp || true)"
          if [ "${STATUS_CODE}" != "000" ]; then
            echo "MCP server is up (HTTP ${STATUS_CODE})"
            break
          fi
          sleep 1
        done

        if [ "${STATUS_CODE}" = "000" ]; then
          echo "MCP server failed to start in time"
          cat server.log || true
          exit 1
        fi

        # Run the client test
        uv --directory . run examples/example_client.py

        # Clean up server process
        kill $SERVER_PID || true

    - name: Replay incident tools against native Pinot
      run: |
        REPLAY_DIR="${RUNNER_TEMP}/incident-replay"
        uv run --frozen python examples/incident_replay/fixture.py --output "$REPLAY_DIR" --seeds 1 --start-seed 100 --extended-cases
        DATASET_DIR="$REPLAY_DIR/seed_100"
        uv run --frozen python examples/incident_replay/load.py --dataset "$DATASET_DIR" --controller http://localhost:9000 --broker http://localhost:8000 --output "$REPLAY_DIR/parity.json"
        uv run --frozen python examples/incident_replay/runner.py --dataset "$DATASET_DIR" --controller http://localhost:9000 --broker http://localhost:8000 --mode scripted --output "$REPLAY_DIR/predictions"
        uv run --frozen python examples/incident_replay/score.py --predictions "$REPLAY_DIR/predictions/predictions.json" --truth "$DATASET_DIR/truth.json" --output "$REPLAY_DIR/score.json"
        uv run --frozen python examples/incident_replay/probes.py --dataset "$DATASET_DIR" --controller http://localhost:9000 --broker http://localhost:8000 --output "$REPLAY_DIR/probes.json"
        uv run --frozen python - "$REPLAY_DIR/score.json" <<'PY'
        import json
        import sys
        score = json.load(open(sys.argv[1]))
        if any(score[key] != score["case_count"] for key in ("correct_count", "completed_count", "qualified_state_matches")):
            raise SystemExit("Scripted MCP replay did not complete all qualified expected outcomes")
        PY

    - name: Preserve incident replay receipts
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: incident-replay-native-pinot
        path: ${{ runner.temp }}/incident-replay
        if-no-files-found: warn
    
    - name: Cleanup
      if: always()
      run: |
        docker stop pinot-quickstart || true
        docker rm pinot-quickstart || true
