name: Repo Maintainer Worker
run-name: Repo Maintainer Worker | ${{ inputs.task }} | ${{ inputs.lease }}

on:
  workflow_dispatch:
    inputs:
      task:
        description: Authorized ledger task, for example issue:12
        required: true
        type: string
      lease:
        description: Controller-issued one-time lease UUID
        required: true
        type: string


concurrency:
  group: repo-maintainer-worker-${{ github.repository }}-${{ inputs.task }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    if: ${{ contains(fromJSON('["maintain","autopilot"]'), vars.MAINTAINER_MODE) && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      expected_sha: ${{ steps.prepare.outputs.expected_sha }}
      control_sha: ${{ steps.control.outputs.sha }}
    steps:
      - name: Check immutable runtime pin
        env:
          RUNTIME_REF: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
        run: |
          [[ "$RUNTIME_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'runtime-ref must be a full lowercase commit SHA' >&2; exit 1; }
      - name: Checkout centralized runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: startreedata/startree-code-review-bot
          ref: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
          path: runtime
          token: ${{ secrets.MAINTAINER_RUNTIME_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Record trusted control version
        id: control
        run: echo "sha=$(git -C control rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Create read-only App token
        id: app
        if: ${{ vars.MAINTAINER_WRITER_AUTH != 'user' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAINTAINER_APP_ID }}
          private-key: ${{ secrets.MAINTAINER_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-checks: read
          permission-actions: read
      - name: Verify live authorization and lease
        id: prepare
        env:
          GH_TOKEN: ${{ vars.MAINTAINER_WRITER_AUTH == 'user' && secrets.MAINTAINER_WRITER_TOKEN || steps.app.outputs.token }}
          MAINTAINER_WRITER_ACTOR: ${{ steps.app.outputs.app-slug != '' && format('{0}[bot]', steps.app.outputs.app-slug) || '' }}
          MAINTAINER_MODE: ${{ vars.MAINTAINER_MODE }}
          TASK_KEY: ${{ inputs.task }}
          TASK_LEASE: ${{ inputs.lease }}
        run: PYTHONPATH=runtime/src python -m startree_review_bot.maintainer worker prepare --policy control/.github/maintainer/policy.toml --task "$TASK_KEY" --lease "$TASK_LEASE" --output prepared.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintainer-prepared
          path: prepared.json
          retention-days: 7
          if-no-files-found: error

  edit:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check immutable runtime pin
        env:
          RUNTIME_REF: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
        run: |
          [[ "$RUNTIME_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'runtime-ref must be a full lowercase commit SHA' >&2; exit 1; }
      - name: Checkout centralized runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: startreedata/startree-code-review-bot
          ref: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
          path: runtime
          token: ${{ secrets.MAINTAINER_RUNTIME_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.expected_sha }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maintainer-prepared
          path: prepared
      - name: Build isolated worker runtime
        run: docker build -t repo-maintainer-runtime -f runtime/src/startree_review_bot/maintainer/worker.Dockerfile runtime
      - name: Edit with file tools and a bounded model budget
        env:
          ANTHROPIC_API_KEY: ${{ secrets.MAINTAINER_ANTHROPIC_API_KEY }}
        run: |
          mkdir -p output
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE/target,target=/work" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/control,target=/control,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/prepared,target=/prepared,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/output,target=/output" \
            -e ANTHROPIC_API_KEY repo-maintainer-runtime \
            python -I -m startree_review_bot.maintainer worker run --prepared /prepared/prepared.json --checkout /work --output /output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintainer-candidate
          path: output/
          retention-days: 7
          if-no-files-found: error

  validate:
    name: validate
    needs: [prepare, edit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check immutable runtime pin
        env:
          RUNTIME_REF: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
        run: |
          [[ "$RUNTIME_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'runtime-ref must be a full lowercase commit SHA' >&2; exit 1; }
      - name: Checkout centralized runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: startreedata/startree-code-review-bot
          ref: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
          path: runtime
          token: ${{ secrets.MAINTAINER_RUNTIME_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.expected_sha }}
          path: target
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maintainer-prepared
          path: prepared
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maintainer-candidate
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Apply only a policy-compliant patch
        run: PYTHONPATH=runtime/src python -m startree_review_bot.maintainer publish validate --policy control/.github/maintainer/policy.toml --prepared prepared/prepared.json --patch candidate/change.patch --checkout target
      - name: Build isolated validation runtime
        run: docker build -t repo-maintainer-runtime -f runtime/src/startree_review_bot/maintainer/worker.Dockerfile runtime
      - name: Validate candidate without secrets or GitHub credentials
        run: |
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE/target,target=/work" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/control,target=/control,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/prepared,target=/prepared,readonly" \
            -e HOME=/tmp -e UV_CACHE_DIR=/tmp/uv-cache repo-maintainer-runtime \
            python -I -m startree_review_bot.maintainer validate --control-root /control --checkout /work

  publish:
    needs: [prepare, validate]
    if: ${{ contains(fromJSON('["maintain","autopilot"]'), vars.MAINTAINER_MODE) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check immutable runtime pin
        env:
          RUNTIME_REF: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
        run: |
          [[ "$RUNTIME_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'runtime-ref must be a full lowercase commit SHA' >&2; exit 1; }
      - name: Checkout centralized runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: startreedata/startree-code-review-bot
          ref: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
          path: runtime
          token: ${{ secrets.MAINTAINER_RUNTIME_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.expected_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maintainer-candidate
          path: candidate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Create publisher App token
        id: app
        if: ${{ vars.MAINTAINER_WRITER_AUTH != 'user' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAINTAINER_APP_ID }}
          private-key: ${{ secrets.MAINTAINER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: read
          permission-pull-requests: write
          permission-actions: read
      - name: Revalidate live state and publish from a clean checkout
        env:
          GH_TOKEN: ${{ vars.MAINTAINER_WRITER_AUTH == 'user' && secrets.MAINTAINER_WRITER_TOKEN || steps.app.outputs.token }}
          MAINTAINER_WRITER_ACTOR: ${{ steps.app.outputs.app-slug != '' && format('{0}[bot]', steps.app.outputs.app-slug) || '' }}
          MAINTAINER_MODE: ${{ vars.MAINTAINER_MODE }}
          TASK_KEY: ${{ inputs.task }}
          TASK_LEASE: ${{ inputs.lease }}
          VALIDATION_RUN: ${{ github.run_id }}
        run: PYTHONPATH=runtime/src python -m startree_review_bot.maintainer publish publish --policy control/.github/maintainer/policy.toml --task "$TASK_KEY" --lease "$TASK_LEASE" --patch candidate/change.patch --checkout target --validation-run "$VALIDATION_RUN"
