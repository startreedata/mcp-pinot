name: Repo Maintainer Reviewer

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: ["Build and Test", "Lint", "Test Pinot Quickstart"]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Optional PR number; leave blank to process the open PR backlog
        required: false
        default: ''
        type: string
      retry:
        description: Retry an expired failed lease for the specified PR after verifying its old run has stopped
        required: false
        default: false
        type: boolean


concurrency:
  group: repo-maintainer-reviewer-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ contains(fromJSON('["review","approve"]'), vars.MAINTAINER_REVIEWER_MODE) && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      control_sha: ${{ steps.prepare.outputs.control_sha }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
    steps:
      - name: Check immutable runtime pin
        env:
          RUNTIME_REF: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
        run: |
          [[ "$RUNTIME_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'runtime-ref must be a full lowercase commit SHA' >&2; exit 1; }
      - name: Checkout centralized runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: startreedata/startree-code-review-bot
          ref: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
          path: runtime
          token: ${{ secrets.MAINTAINER_RUNTIME_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Create independent reviewer App token
        id: app
        if: ${{ vars.MAINTAINER_REVIEWER_AUTH != 'user' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAINTAINER_REVIEWER_APP_ID }}
          private-key: ${{ secrets.MAINTAINER_REVIEWER_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read
          permission-checks: read
          permission-actions: read
      - name: Prepare bounded PR evidence and reserve reviewer lease
        id: prepare
        env:
          GH_TOKEN: ${{ vars.MAINTAINER_REVIEWER_AUTH == 'user' && secrets.MAINTAINER_REVIEWER_TOKEN || steps.app.outputs.token }}
          MAINTAINER_REVIEWER_ACTOR: ${{ steps.app.outputs.app-slug != '' && format('{0}[bot]', steps.app.outputs.app-slug) || '' }}
          MAINTAINER_REVIEWER_MODE: ${{ vars.MAINTAINER_REVIEWER_MODE }}
          REQUESTED_PR: ${{ inputs.pr }}
          RETRY_FAILED_REVIEW: ${{ inputs.retry }}
        run: |
          args=()
          if [ -n "$REQUESTED_PR" ]; then
            args+=(--pr "$REQUESTED_PR")
          fi
          if [ "$RETRY_FAILED_REVIEW" = 'true' ]; then
            args+=(--retry)
          fi
          PYTHONPATH=runtime/src python -m startree_review_bot.maintainer reviewer prepare --policy control/.github/maintainer/policy.toml "${args[@]}" --output prepared.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ steps.prepare.outputs.ready == 'true' }}
        with:
          name: maintainer-review-prepared
          path: prepared.json
          retention-days: 7
          if-no-files-found: error

  review:
    needs: prepare
    if: ${{ needs.prepare.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check immutable runtime pin
        env:
          RUNTIME_REF: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
        run: |
          [[ "$RUNTIME_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'runtime-ref must be a full lowercase commit SHA' >&2; exit 1; }
      - name: Checkout centralized runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: startreedata/startree-code-review-bot
          ref: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
          path: runtime
          token: ${{ secrets.MAINTAINER_RUNTIME_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maintainer-review-prepared
          path: prepared
      - name: Build isolated reviewer runtime
        run: docker build -t repo-maintainer-runtime -f runtime/src/startree_review_bot/maintainer/worker.Dockerfile runtime
      - name: Review with an independent model session and read-only tools
        env:
          ANTHROPIC_API_KEY: ${{ secrets.MAINTAINER_REVIEWER_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p output
          docker run --rm --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,source=$GITHUB_WORKSPACE/control,target=/control,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/prepared,target=/prepared,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/output,target=/output" \
            -e ANTHROPIC_API_KEY repo-maintainer-runtime \
            python -I -m startree_review_bot.maintainer reviewer run --context-root /control --prepared /prepared/prepared.json --output /output/review.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintainer-review-result
          path: output/review.json
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [prepare, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check immutable runtime pin
        env:
          RUNTIME_REF: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
        run: |
          [[ "$RUNTIME_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'runtime-ref must be a full lowercase commit SHA' >&2; exit 1; }
      - name: Checkout centralized runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: startreedata/startree-code-review-bot
          ref: ${{ '2f632b5a9c4ce76927c6d347168cc082bbcdbea9' }}
          path: runtime
          token: ${{ secrets.MAINTAINER_RUNTIME_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.control_sha }}
          path: control
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maintainer-review-prepared
          path: prepared
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maintainer-review-result
          path: result
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Create fresh independent review publisher App token
        id: app
        if: ${{ vars.MAINTAINER_REVIEWER_AUTH != 'user' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.MAINTAINER_REVIEWER_APP_ID }}
          private-key: ${{ secrets.MAINTAINER_REVIEWER_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-checks: read
          permission-actions: read
      - name: Recheck current SHA and publish a native review
        env:
          GH_TOKEN: ${{ vars.MAINTAINER_REVIEWER_AUTH == 'user' && secrets.MAINTAINER_REVIEWER_TOKEN || steps.app.outputs.token }}
          MAINTAINER_REVIEWER_ACTOR: ${{ steps.app.outputs.app-slug != '' && format('{0}[bot]', steps.app.outputs.app-slug) || '' }}
          MAINTAINER_REVIEWER_MODE: ${{ vars.MAINTAINER_REVIEWER_MODE }}
        run: PYTHONPATH=runtime/src python -m startree_review_bot.maintainer reviewer publish --policy control/.github/maintainer/policy.toml --prepared prepared/prepared.json --result result/review.json
