name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  FASTMCP_MCP_CAMELCASE_COMPAT: "false"

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        version: "0.8.22"
        python-version: ${{ matrix.python-version }}

    - name: Verify lockfile
      run: uv lock --check

    - name: Install dependencies
      run: uv sync --frozen --all-extras

    - name: Run tests
      run: uv run pytest tests/ --cov=mcp_pinot --cov-report=xml

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Build production image without pushing
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        platforms: linux/amd64
        push: false
        tags: mcp-pinot:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max
