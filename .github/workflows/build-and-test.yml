name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  FASTMCP_MCP_CAMELCASE_COMPAT: "false"

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.8.22"
        python-version: ${{ matrix.python-version }}

    - name: Verify lockfile
      run: uv lock --check

    - name: Install dependencies
      run: uv sync --frozen --all-extras

    - name: Run tests
      run: uv run pytest tests/ --cov=mcp_pinot --cov-report=xml

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Build production image without pushing
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        platforms: linux/amd64
        push: false
        load: true
        tags: mcp-pinot:ci
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke test the built image over STDIO
      run: |
        docker run --rm -i --network none \
          -e MCP_TRANSPORT=stdio -e AUTH_PROVIDER=none \
          -e PINOT_CONTROLLER_URL=http://localhost:9000 \
          -e PINOT_BROKER_URL=http://localhost:8000 \
          -e FASTMCP_MCP_CAMELCASE_COMPAT=false \
          --entrypoint python mcp-pinot:ci - <<'PY'
        import asyncio
        import os
        from fastmcp import Client
        from fastmcp.client.transports import StdioTransport

        async def smoke():
            transport = StdioTransport(command="/app/run.sh", args=[], env=dict(os.environ))
            async with Client(transport, timeout=15, init_timeout=15) as client:
                tools = await client.list_tools()
                assert any(tool.name == "read_query" for tool in tools)
                assert all(tool.input_schema and tool.output_schema for tool in tools)
                assert {prompt.name for prompt in await client.list_prompts()} == {
                    "pinot_query", "explore_table"
                }
                assert await client.list_resources()
                assert await client.list_resource_templates()
        asyncio.run(smoke())
        PY
